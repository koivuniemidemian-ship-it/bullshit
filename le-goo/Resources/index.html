<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Goo by ballhogaudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;600;700;800&family=Bungee&display=swap" rel="stylesheet">
<style>
/* VOICE: premium boutique plugin that mutates — calm graphite at 0, a living ballhog machine at 100.
   IDEA: the whole faceplate is one instrument tuned by Le Goo; Bradygoo bounces on the exact beat grid.
   PICTURE: Bradygoo in a camera viewfinder with a timecode HUD; aura, ghosts, clones, lightning at max.
   COLOUR and TYPE: graphite + chrome that heats to violet, crimson, then rainbow; Archivo, Anton, Bungee.
   LAYOUT: portrait — brand bar, warning tape, viewfinder, LED-ringed knob with meters, stage lamps, BPM + aura LCDs, transport, spectrum. */
:root{color-scheme:dark;--bg:#0c0a0e;--ink:#efe9f4;--dim:#9b90a6;--line:#2c2533;--a1:#8b5cff;--a2:#ff2d6f;--hue:265;--k:0;--b:0}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}body{margin:0;background:var(--bg);font:16px/1.5 Archivo,-apple-system,system-ui,sans-serif;overflow:hidden;position:relative;user-select:none;-webkit-user-select:none}
#fit{position:absolute;left:0;top:0;width:480px;transform-origin:0 0}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(60% 50% at 50% 45%,hsl(var(--hue) 90% 50% / calc(var(--k)*.35 + var(--b)*var(--k)*.15)),transparent 70%),#05030a;opacity:calc(var(--k)*.9);pointer-events:none}
.unit{position:relative;width:480px;border-radius:28px;padding:3px;background:linear-gradient(180deg,hsl(var(--hue) calc(var(--k)*90%) 95%),hsl(var(--hue) calc(var(--k)*70%) calc(62% - var(--k)*14%)) 45%,hsl(var(--hue) calc(var(--k)*90%) 92%) 55%,hsl(var(--hue) calc(var(--k)*60%) calc(48% - var(--k)*10%)));box-shadow:0 40px 80px -30px #1a0a2acc,0 4px 12px #0006,0 0 calc(var(--k)*70px + var(--b)*var(--k)*40px) calc(var(--k)*8px) hsl(var(--hue) 100% 60% / calc(var(--k)*.6))}
.plate{position:relative;border-radius:25px;padding:18px 20px 16px;color:var(--ink);background:radial-gradient(120% 60% at 50% 0%,#2a2131,transparent 60%),linear-gradient(180deg,#1d1822,#141117 55%,#100d12);box-shadow:inset 0 1px 0 #ffffff1a,inset 0 -2px 0 #00000080;overflow:hidden}
.plate::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff04 0 1px,transparent 1px 3px);pointer-events:none}
.plate::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 45% at 50% 30%,hsl(var(--hue) 100% 55% / calc(var(--k)*.28 + var(--b)*var(--k)*.12)),transparent 70%),radial-gradient(70% 30% at 50% 88%,hsl(calc(var(--hue) + 40) 100% 55% / calc(var(--k)*.16)),transparent 70%);pointer-events:none}
#veins{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
.screw{position:absolute;z-index:2;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8d2de,#5a5361 70%);box-shadow:0 1px 1px #000a,inset 0 -1px 1px #0006,0 0 calc(var(--k)*8px) hsl(var(--hue) 100% 60% / var(--k))}
.screw::after{content:"";position:absolute;left:2px;right:2px;top:5px;height:2px;border-radius:1px;background:#2a2430;transform:rotate(var(--r,30deg))}
.z{position:relative;z-index:1}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 8px 12px}
.brand{display:flex;align-items:center;gap:8px;font:800 19px/1 Archivo,sans-serif;letter-spacing:-.02em;text-shadow:0 0 calc(var(--k)*12px) hsl(var(--hue) 100% 65% / var(--k))}
.brand svg{width:26px;height:26px}
.brand em{font-style:normal;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{font:700 11px Archivo,sans-serif;color:#1a1520;background:linear-gradient(180deg,#f4f1f7,hsl(var(--hue) calc(var(--k)*90%) 72%));padding:4px 9px;border-radius:6px;box-shadow:0 1px 0 #000a;white-space:nowrap}
.tapeSlot{height:22px;display:flex;align-items:center}.tape{height:0;flex:1;overflow:hidden;margin:0 -20px;background:repeating-linear-gradient(-45deg,#111 0 12px,hsl(var(--hue) 100% 58%) 12px 24px);box-shadow:inset 0 2px 0 #0008,inset 0 -2px 0 #0008;display:flex;align-items:center}
.tape span{flex:none;font:400 13px/1 Anton,Impact,sans-serif;letter-spacing:.12em;color:#fff;text-shadow:0 0 4px #000,0 0 2px #000;white-space:nowrap;padding-left:8px}
.vf{position:relative;width:262px;margin:8px auto 0;aspect-ratio:820/1580;border-radius:17px;padding:7px;background:#0a080c;box-shadow:0 0 0 1px #3a3142,0 0 var(--glow,0px) calc(var(--glow,0px)/5) hsl(var(--hue) 100% 60% / .55),0 20px 36px -14px #000}
.scene{position:relative;width:100%;height:100%;border-radius:11px;overflow:hidden;background:#000;isolation:isolate}
.scene>.L{position:absolute;inset:0;width:100%;height:100%}
#stage{transform-origin:50% 55%}
#fx,#grain,#scan{pointer-events:none}
#fx{mix-blend-mode:screen}#grain{mix-blend-mode:overlay}
#scan{background:repeating-linear-gradient(0deg,#0000 0 2px,#00000055 2px 3px);opacity:0}
.bar{position:absolute;left:0;right:0;height:0;background:#000;z-index:3}
.bar.t{top:0}.bar.b{bottom:0}
#flash{background:#fff;opacity:0;mix-blend-mode:screen;z-index:4}
#inv{background:#fff;opacity:0;mix-blend-mode:difference;z-index:4}
.hud{position:absolute;z-index:5;left:9px;right:9px;display:flex;justify-content:space-between;align-items:center;gap:6px;font:700 10.5px Archivo,sans-serif;color:#fff;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.hud.top{top:9px}.hud.bot{bottom:9px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#0008;border:1px solid #ffffff2a;border-radius:20px;padding:3px 8px;backdrop-filter:blur(4px);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#ff2d4a;box-shadow:0 0 6px #ff2d4a}
#chipR{opacity:0;background:hsl(var(--hue) 90% 45% / .7);border-color:#fff6}
.corner{position:absolute;z-index:5;width:16px;height:16px;border:2px solid #fffa;opacity:.7}
.corner.a{left:14px;top:38px;border-right:0;border-bottom:0}.corner.b{right:14px;top:38px;border-left:0;border-bottom:0}.corner.c{left:14px;bottom:38px;border-right:0;border-top:0}.corner.d{right:14px;bottom:38px;border-left:0;border-top:0}
.glass{position:absolute;inset:7px;border-radius:11px;background:linear-gradient(160deg,#ffffff1c,transparent 28%);box-shadow:inset 0 0 0 1px #ffffff10,inset 0 0 30px #0009;pointer-events:none;z-index:6}
.ctrl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:12px 10px 0}
.meter{display:grid;justify-items:center;gap:6px;font:700 10px Archivo,sans-serif;color:var(--dim)}
.leds{display:flex;flex-direction:column-reverse;gap:3px;padding:5px;border-radius:6px;background:#08070a;box-shadow:inset 0 1px 3px #000,0 1px 0 #ffffff10}
.leds i{width:12px;height:7px;border-radius:2px;background:#221d27}
.leds i.on{background:var(--c);box-shadow:0 0 6px var(--c)}
.kwrap{display:grid;justify-items:center}
.knob{width:212px;aspect-ratio:1;user-select:none;touch-action:none;cursor:ns-resize;border-radius:50%}
.knob svg{width:100%;height:100%;overflow:visible}
.knob:focus-visible{outline:2px solid hsl(var(--hue) 100% 65%);outline-offset:6px}
.read{display:flex;gap:8px;align-items:baseline;margin-top:-6px}
.read b{font:700 18px Archivo,sans-serif;font-variant-numeric:tabular-nums}
.read span{font-size:13px;color:var(--dim);white-space:nowrap}
.lamps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:8px;margin-top:10px;border-radius:10px;background:#0b090d;box-shadow:inset 0 1px 3px #000,0 1px 0 #ffffff0d}
.lamp{display:grid;justify-items:center;gap:4px;font:700 9px Archivo,sans-serif;color:#6f6579;text-align:center;line-height:1.1}
.lamp i{width:10px;height:10px;border-radius:50%;background:#241e2a;box-shadow:inset 0 1px 1px #000}
.lamp.on{color:var(--ink)}.lamp.on i{background:var(--c);box-shadow:0 0 8px var(--c)}
.readouts{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:8px;padding-top:8px}
.lcd{border-radius:10px;background:linear-gradient(#150f1d,#0c0912);box-shadow:inset 0 1px 4px #000,0 1px 0 #ffffff0d,inset 0 0 0 1px hsl(var(--hue) 80% 50% / calc(var(--k)*.4));padding:7px 10px;display:grid;gap:4px}
.lcd small{font:700 9px Archivo,sans-serif;color:#7c6c92;letter-spacing:.06em;display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.lcd b{font:400 22px/1 Anton,Impact,sans-serif;color:hsl(var(--hue) 100% 74%);text-shadow:0 0 8px hsl(var(--hue) 100% 60% / .7);font-variant-numeric:tabular-nums;white-space:nowrap}
.lcd b sub{font:700 10px Archivo,sans-serif;vertical-align:baseline;color:#8c7ca3;margin-left:3px}
.bpmrow{display:flex;align-items:center;justify-content:space-between;gap:6px}
.beats{display:flex;gap:4px}
.beats i{width:9px;height:9px;border-radius:2px;background:#251f2c}
.beats i.on{background:hsl(var(--hue) 100% 65%);box-shadow:0 0 8px hsl(var(--hue) 100% 60%)}
.beats i.on.one{background:#fff}
.tempo{display:flex;gap:4px}
.tempo button{min-height:28px;padding:0 6px;font-size:11px;border-radius:7px;flex:1}
.tempo button[aria-pressed=true]{background:linear-gradient(hsl(var(--hue) 55% 45%),hsl(var(--hue) 55% 30%));border-color:hsl(var(--hue) 80% 70%)}
.tempo small{align-self:center;color:#7c6c92;font:700 9px Archivo,sans-serif;letter-spacing:.06em;white-space:nowrap}
.deck{display:grid;gap:10px;padding-top:10px;margin-top:8px;border-top:1px solid var(--line)}
.tx{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
button,.file{position:relative;font:700 14px Archivo,sans-serif;color:var(--ink);background:linear-gradient(#2c2632,#1c1820);border:1px solid hsl(var(--hue) calc(var(--k)*60%) calc(24% + var(--k)*20%));border-radius:11px;min-height:46px;padding:0 10px;cursor:pointer;box-shadow:0 2px 0 #000a,inset 0 1px 0 #ffffff12;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
button:hover,.file:hover{border-color:#8b78a3}
button:focus-visible,.file:focus-within{outline:2px solid hsl(var(--hue) 100% 65%);outline-offset:2px}
button svg,.file svg{width:16px;height:16px;flex:none}
#play[aria-pressed=true]{background:linear-gradient(hsl(var(--hue) 55% 45%),hsl(var(--hue) 55% 30%));border-color:hsl(var(--hue) 80% 70%)}
#bypass[aria-pressed=true]{background:linear-gradient(#7a1d3c,#4d1226);border-color:#d23c66}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.scope{position:relative;height:66px;border-radius:10px;background:#08070a;box-shadow:inset 0 2px 8px #000,0 1px 0 #ffffff0d}
.scope canvas{position:absolute;inset:0;width:100%;height:100%}
.status{font-size:12px;color:var(--dim);padding:6px 6px 0}
.foot{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;padding:10px 14px 0;font:600 11px Archivo,sans-serif;color:#6f6579;text-shadow:0 1px 0 #000}

</style></head><body>
<div id="fit"><div class="unit" id="unit"><div class="plate">
  <canvas id="veins"></canvas>
  <i class="screw" style="left:10px;top:10px"></i><i class="screw" style="right:10px;top:10px;--r:-50deg"></i><i class="screw" style="left:10px;bottom:10px;--r:70deg"></i><i class="screw" style="right:10px;bottom:10px;--r:10deg"></i>
  <header class="z">
    <div class="brand"><svg viewBox="0 0 26 26" aria-hidden="true"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#8b5cff"/><stop offset="1" stop-color="#ff2d6f"/></linearGradient></defs><circle cx="13" cy="13" r="12" fill="none" stroke="url(#lg)" stroke-width="2"/><path d="M5 13c2-5 4-5 6 0s4 5 6 0 3-4 4-2" fill="none" stroke="#efe9f4" stroke-width="2" stroke-linecap="round"/></svg><span>ballhog<em>audio</em></span></div>

        <defs>

            <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="d"/><feGaussianBlur in="d" stdDeviation="7" result="b"/>
            <feFlood id="acol2" flood-color="#ff2d6f"/><feComposite in2="b" operator="in"/>
          </filter>
          <filter id="rim" x="-5%" y="-5%" width="110%" height="110%">
            <feMorphology in="SourceAlpha" operator="dilate" radius="2.5" result="d"/><feFlood flood-color="#fff"/><feComposite in2="d" operator="in"/><feGaussianBlur stdDeviation="1.2"/>
          </filter>

            <feFlood id="tcol" flood-color="#8b5cff"/><feComposite in2="SourceAlpha" operator="in"/>
          </filter>
          <radialGradient id="vig" cx="50%" cy="42%" r="70%"><stop offset=".35" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".95"/></radialGradient>
          <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".9"/></linearGradient>

  $('halo').setAttribute('opacity',(hard*(.25+pulse*.5)).toFixed(2));$('halo').setAttribute('stroke',col);
  const lit=Math.round(goo/100*(RN-1)),chase=playing&&mx>.01?Math.floor(p*RN):-9;
  ringDots.forEach((d2,i)=>{const on=i<=lit&&goo>0,c=Math.abs(i-chase)<2;d2.setAttribute('fill',c?'#fff':on?`hsl(${(hue+i*(mx*12))%360} 100% ${on&&i===lit?80:62}%)`:'#2a2430');d2.setAttribute('r',c?3:on?2.3:2.1)});
  const gx=(pulse*mx*4).toFixed(1);$('kR').setAttribute('opacity',(mx*.9).toFixed(2));$('kC').setAttribute('opacity',(mx*.9).toFixed(2));$('kR').setAttribute('x',120-gx);$('kC').setAttribute('x',120+ +gx);
  $('kT').setAttribute('fill',mx>.5?'#fff':'#f3eef8');
  shownPts+=(points-shownPts)*.15;$('pts').textContent=Math.round(shownPts).toLocaleString('en-US');
  // faceplate veins: beat-locked energy lines
  {const[W,H,d]=size(vc);vg.setTransform(d,0,0,d,0,0);vg.clearRect(0,0,W,H);
    if(a>.02){vg.lineWidth=1.2;for(let j=0;j<6;j++){const yy=H*(.12+j*.16);vg.strokeStyle=`hsla(${(hue+j*14)%360},100%,62%,${(a*.22+pulse*a*.25).toFixed(3)})`;vg.beginPath();
      for(let xx=0;xx<=W;xx+=6){const v=Math.sin(xx*.03+ph*3+j)*6*a+Math.sin(xx*.011-ph*2+j*2)*10*a*(.5+pulse);xx?vg.lineTo(xx,yy+v):vg.moveTo(xx,yy+v)}vg.stroke()}}}
  // fx canvas
  const [W,H,d]=size(fx);fg.setTransform(d,0,0,d,0,0);fg.clearRect(0,0,W,H);
  const sc=Math.max(W/820,H/1580),ox=(W-820*sc)/2,oy=(H-1580*sc)/2,X=v=>ox+v*sc,Y=v=>oy+v*sc;
  if(speed>.05&&!reduce){fg.save();fg.globalAlpha=speed*.7;fg.strokeStyle='#fff';fg.lineWidth=1.2;const cx=W/2,cy=H*.45;
    for(let i=0;i<46;i++){const an=i/46*6.283+kick,r0=Math.min(W,H)*rnd(.32,.5),r1=r0+rnd(40,140);fg.beginPath();fg.moveTo(cx+Math.cos(an)*r0,cy+Math.sin(an)*r0);fg.lineTo(cx+Math.cos(an)*r1,cy+Math.sin(an)*r1);fg.stroke()}fg.restore()}
  rings=rings.filter(r=>(r.t+=.035*dt)<1);
  for(const r of rings){const e=1-Math.pow(1-r.t,3);fg.strokeStyle=`hsla(${hue},100%,70%,${(1-r.t)*.9})`;fg.lineWidth=(1-r.t)*6*r.big+1;
    fg.beginPath();fg.ellipse(X(410+x),Y(1540),e*W*.7*r.big,e*W*.12*r.big,0,0,6.283);fg.stroke();
    if(r.big>.8){fg.beginPath();fg.arc(X(410+x),Y(700),e*W*.8,0,6.283);fg.lineWidth=(1-r.t)*3;fg.stroke()}}
  bolts=bolts.filter(b=>(b.t+=.08*dt)<1);
  for(const b of bolts){fg.save();fg.globalAlpha=1-b.t;fg.strokeStyle='#fff';fg.shadowColor=col;fg.shadowBlur=16;fg.lineWidth=2.2;fg.beginPath();b.pts.forEach(([px,py],i)=>i?fg.lineTo(px*W,py*H):fg.moveTo(px*W,py*H));fg.stroke();fg.lineWidth=6;fg.globalAlpha=(1-b.t)*.35;fg.strokeStyle=col;fg.stroke();fg.restore()}
  const cnt=Math.round(sm(.3,1,k)*parts.length);
  for(let i=0;i<cnt;i++){const pa=parts[i];if(!reduce){pa.y-=(.0012+pa.v*.004)*(1+pulse*3+mx*2)*dt;pa.w+=.03*dt;if(pa.y<-.05){pa.y=1.05;pa.x=.1+Math.random()*.8}}
    const px=(pa.x+Math.sin(pa.w)*.02)*W,py=pa.y*H,rad=.4+pa.s*1.3+pulse*pa.s,al=(.25+.6*pa.s)*Math.min(1,(1.05-pa.y)*3),h2=(hue+pa.s*60)%360;
    const gd=fg.createRadialGradient(px,py,0,px,py,rad*3);gd.addColorStop(0,`rgba(255,255,255,${al})`);gd.addColorStop(.3,`hsla(${h2},100%,65%,${al*.8})`);gd.addColorStop(1,`hsla(${h2},100%,65%,0)`);
    fg.fillStyle=gd;fg.beginPath();fg.arc(px,py,rad*3,0,6.283);fg.fill()}
  pops=pops.filter(o=>(o.t+=.03*dt)<1);
  for(const o of pops){const e=o.t<.15?o.t/.15:1,s=lerp(1.8,1,Math.min(1,o.t/.15))+o.t*.15;fg.save();fg.translate(o.x*W,o.y*H);fg.rotate(o.r*Math.PI/180);fg.scale(s,s);
    fg.globalAlpha=e*(1-sm(.6,1,o.t));fg.font=`400 ${Math.round(W*.13)}px Anton,Impact,sans-serif`;fg.textAlign='center';fg.textBaseline='middle';
    fg.lineWidth=4;fg.strokeStyle='#000';fg.strokeText(o.w,0,0);fg.fillStyle='#fff';fg.shadowColor=col;fg.shadowBlur=18;fg.fillText(o.w,0,0);fg.restore()}
  {const[GW,GH2,gd2]=size(gr);gg.setTransform(gd2,0,0,gd2,0,0);gg.clearRect(0,0,GW,GH2);
    const ga=sm(.4,1,k)*.32+mx*.1;if(ga>0){gg.globalAlpha=ga;gg.fillStyle=gg.createPattern(grains[Math.floor(now/60)%4],'repeat');gg.fillRect(0,0,GW,GH2);gg.globalAlpha=1}}
  // spectrum + scope
  {const[SW,SH,sd]=size(cv);g.setTransform(sd,0,0,sd,0,0);g.clearRect(0,0,SW,SH);
    g.strokeStyle='#1d1922';g.lineWidth=1;for(let i=1;i<4;i++){g.beginPath();g.moveTo(0,SH*i/4);g.lineTo(SW,SH*i/4);g.stroke()}
    const sp=S.spec||[],wv=S.wave||[];
    if(sp.length){const NB=sp.length,bw=SW/NB;for(let i=0;i<NB;i++){const h=sp[i]*SH*.95;g.fillStyle=`hsla(${(hue+i*(3+mx*6))%360},90%,60%,.55)`;g.fillRect(i*bw+1,SH-h,bw-2,h)}}
    if(wv.length){g.strokeStyle='#fff';g.lineWidth=1.6;g.shadowColor=col;g.shadowBlur=8;g.beginPath();for(let i=0;i<wv.length;i++){const xx=i/(wv.length-1)*SW,yy=SH/2-clamp(wv[i],-1,1)*SH*.45;i?g.lineTo(xx,yy):g.moveTo(xx,yy)}g.stroke();g.shadowBlur=0}
    if(playing){g.fillStyle='#ffffffaa';const px=frac(ppqNow/((S.num||4)*4))*SW;g.fillRect(px,0,1,SH)}}
  requestAnimationFrame(frame)}

if(J){J.addEventListener('state',o=>{S=o;sT=performance.now();if(!dragging&&Math.abs(o.goo-goo)>.01){goo=+o.goo;draw()}})}
window.__unitH=()=>unit.offsetHeight;
draw();doFit();requestAnimationFrame(frame);
}
