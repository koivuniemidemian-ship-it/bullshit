name: Build Le Goo installer

on:
  push:
    branches: [main]
    paths:
      - "le-goo/**"
      - ".github/workflows/le-goo.yml"
    tags: ["le-goo-v*"]
  pull_request:
    paths:
      - "le-goo/**"
      - ".github/workflows/le-goo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: le-goo
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: le-goo/JUCE
          key: le-goo-juce-8.0.4

      - name: Build VST3 + AU and make the .pkg
        run: bash "Build Le Goo Installer.command" < /dev/null

      - name: Show build errors
        if: failure()
        run: |
          grep -n -E "error:|error [A-Z]|CMake Error|fatal:" build.log | head -8 | while IFS= read -r line; do echo "::error title=Le Goo error::${line}"; done || true
          grep -v -E "warning:|note:|In file included|^ *[0-9]* *\||^ +[~^(]|^ *\^|Wnontrivial|generated\.$|Building C|Building CXX" build.log | tail -n 60 > tail.txt || true
          for part in 1 2 3 4; do
            body=$(sed -n "$(( (part-1)*15 + 1 )),$(( part*15 ))p" tail.txt | tr -d '\r' | cut -c1-240 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            [ -n "$body" ] && echo "::error title=Le Goo log ${part}::${body}"
          done
          true

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Le-Goo-Installer
          path: le-goo/Le Goo Installer.pkg

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: le-goo-build-log
          path: le-goo/build.log

      - name: Attach to release (le-goo-v* tags only)
        if: startsWith(github.ref, 'refs/tags/le-goo-v')
        uses: softprops/action-gh-release@v2
        with:
          files: le-goo/Le Goo Installer.pkg
