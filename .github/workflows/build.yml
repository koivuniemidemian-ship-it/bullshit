name: build-macos-pkg

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the .pkg to a GitHub Release on tags

jobs:
  macos:
    runs-on: macos-14
    env:
      # Optional signing secrets. Leave them unset for an unsigned build.
      MACOS_CERT_P12:      ${{ secrets.MACOS_CERT_P12 }}        # base64 .p12 with BOTH Developer ID certs
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APP_SIGN_ID:         ${{ secrets.APP_SIGN_ID }}
      INSTALLER_SIGN_ID:   ${{ secrets.INSTALLER_SIGN_ID }}
      NOTARY_APPLE_ID:     ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID:      ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD:     ${{ secrets.NOTARY_PASSWORD }}       # app-specific password

    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure (universal binary)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Import signing certificates
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build .pkg
        run: |
          chmod +x packaging/build_pkg.sh
          ./packaging/build_pkg.sh "${{ steps.ver.outputs.version }}"

      - name: Notarize
        if: env.NOTARY_APPLE_ID != '' && env.INSTALLER_SIGN_ID != ''
        run: |
          PKG="dist/MoistBoi-${{ steps.ver.outputs.version }}.pkg"
          xcrun notarytool submit "$PKG" --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: MoistBoi-${{ steps.ver.outputs.version }}-macOS
          path: dist/*.pkg

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pkg
